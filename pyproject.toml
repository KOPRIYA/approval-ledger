[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-ledger"
version = "0.1.0"
description = "Auditable agent proposals, human approval and crash-safe tool delivery"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
agents = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "mcp>=1.20,<2"]

[project.scripts]
approval-ledger = "approval_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["approval_ledger*"]
